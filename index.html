<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noveltools</title>
<style>
:root {
  --bg:#1a1814;
  --bg2:#211f1b;
  --bg3:#2a2722;
  --surface:#302d27;
  --accent:#c8a96e;
  --text:#e8e0d0;
  --text2:#a09880;
  --text3:#706858;
  --border:#3f3b34;
  --ok:#7ec8a8;
  --danger:#c06040;
  --font-ui:'Courier New',monospace;
  --font-body:'Georgia',serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px;
}
header { text-align:center; margin-bottom:40px; }
h1 {
  font-family:var(--font-ui);
  letter-spacing:0.08em;
  color:var(--accent);
  font-size:1.6rem;
  margin-bottom:8px;
}
header p { color:var(--text2); font-size:0.9rem; }
.app-list {
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.app-card {
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  text-decoration:none;
  color:var(--text);
  transition:background 0.15s ease, border-color 0.15s ease;
}
.app-card:hover, .app-card:active {
  background:var(--surface);
  border-color:var(--accent);
}
.app-icon {
  width:44px;
  height:44px;
  border-radius:10px;
  background:var(--bg3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.4rem;
  flex-shrink:0;
}
.app-info { flex:1; }
.app-name {
  font-family:var(--font-ui);
  font-size:1.05rem;
  color:var(--text);
}
.app-desc {
  font-size:0.82rem;
  color:var(--text2);
  margin-top:2px;
}
.app-arrow { color:var(--text3); font-size:1.1rem; }
footer {
  margin-top:48px;
  color:var(--text3);
  font-size:0.75rem;
  font-family:var(--font-ui);
  text-align:center;
}
</style>
</head>
<body>

<header>
  <h1>noveltools</h1>
  <p>小説執筆支援ツール群</p>
</header>

<div class="app-list">
  <a class="app-card" href="novel_progress.html">
    <div class="app-icon">📖</div>
    <div class="app-info">
      <div class="app-name">Manuscript</div>
      <div class="app-desc">小説進捗管理・執筆支援</div>
    </div>
    <div class="app-arrow">→</div>
  </a>
  <a class="app-card" href="sales_ledger.html">
    <div class="app-icon">📊</div>
    <div class="app-info">
      <div class="app-name">Ledger</div>
      <div class="app-desc">売上・顧客管理</div>
    </div>
    <div class="app-arrow">→</div>
  </a>
  <a class="app-card" href="activator.html">
    <div class="app-icon">🎯</div>
    <div class="app-info">
      <div class="app-name">activator</div>
      <div class="app-desc">タスク・スケジュール管理</div>
    </div>
    <div class="app-arrow">→</div>
  </a>
</div>

<footer>yoshimitsu08 / noveltools</footer>

</body>
</html>
